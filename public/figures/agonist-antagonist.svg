<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-label="Agonist antagonist pharmacodynamics">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f6f5e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f7faf8"/>
  <rect x="1" y="1" width="638" height="258" fill="none" stroke="#c5d4cb" stroke-width="1"/>
  
      <text x="24" y="28" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1a3a2f">PD — shape of the curve</text>
      <rect x="40" y="80" width="160" height="55" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="120" y="100.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Full agonist</text>
<text x="120" y="114.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Emax = 100%</text>
      <rect x="230" y="80" width="160" height="55" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="310" y="100.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Partial agonist</text>
<text x="310" y="114.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Emax < full</text>
      <rect x="420" y="80" width="180" height="55" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="510" y="100.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Antagonist</text>
<text x="510" y="114.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Shifts / flattens</text>
      <text x="40" y="175" font-family="Georgia, serif" font-size="12" fill="#5c7268">Potency = left-right · Efficacy = height · Spare receptors hide occupancy truths</text>
    
</svg>