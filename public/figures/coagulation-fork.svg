<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-label="Hemostasis primary versus secondary">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f6f5e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f7faf8"/>
  <rect x="1" y="1" width="638" height="248" fill="none" stroke="#c5d4cb" stroke-width="1"/>
  
      <text x="24" y="28" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1a3a2f">Hemostasis fork</text>
      <rect x="220" y="55" width="200" height="40" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="320" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Vessel injury</text>
      <line x1="200" y1="95" x2="120" y2="130" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <line x1="440" y1="95" x2="520" y2="130" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <rect x="40" y="135" width="180" height="60" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="130" y="151" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Primary</text>
<text x="130" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Platelets / vWF</text>
<text x="130" y="179" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Mucocutaneous bleed</text>
      <rect x="420" y="135" width="180" height="60" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="510" y="151" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Secondary</text>
<text x="510" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Coagulation factors</text>
<text x="510" y="179" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Deep/joint bleed</text>
      <text x="40" y="230" font-family="Georgia, serif" font-size="12" fill="#5c7268">Antiplatelets vs anticoagulants hit different arms — match drug to mechanism</text>
    
</svg>