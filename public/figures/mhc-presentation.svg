<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-label="MHC antigen presentation">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f6f5e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f7faf8"/>
  <rect x="1" y="1" width="638" height="248" fill="none" stroke="#c5d4cb" stroke-width="1"/>
  
      <text x="24" y="28" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1a3a2f">Antigen presentation — who talks to whom</text>
      <rect x="40" y="80" width="250" height="70" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="165" y="101" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">MHC I</text>
<text x="165" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Intracellular peptide</text>
<text x="165" y="129" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">→ CD8 T cell</text>
      <rect x="350" y="80" width="250" height="70" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="475" y="101" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">MHC II</text>
<text x="475" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Extracellular peptide</text>
<text x="475" y="129" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">→ CD4 T cell</text>
      <text x="40" y="190" font-family="Georgia, serif" font-size="12" fill="#5c7268">Cross-presentation blurs the rule for dendritic cells — know the default first</text>
    
</svg>