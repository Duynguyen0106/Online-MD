<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-label="Preeclampsia management schematic">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f6f5e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f7faf8"/>
  <rect x="1" y="1" width="638" height="248" fill="none" stroke="#c5d4cb" stroke-width="1"/>
  
      <text x="24" y="28" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1a3a2f">Preeclampsia pathway</text>
      <rect x="40" y="80" width="160" height="50" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="120" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">HTN +</text>
<text x="120" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">proteinuria / EO</text>
      <line x1="200" y1="105" x2="250" y2="105" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <rect x="250" y="80" width="160" height="50" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="330" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Severe</text>
<text x="330" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">features?</text>
      <line x1="410" y1="105" x2="460" y2="105" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <rect x="460" y="70" width="150" height="70" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="535" y="91" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">MgSO₄</text>
<text x="535" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">+ delivery</text>
<text x="535" y="119" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">plan</text>
      <text x="40" y="180" font-family="Georgia, serif" font-size="12" fill="#5c7268">Watch Mg toxicity: loss of reflexes → respiratory depression</text>
    
</svg>