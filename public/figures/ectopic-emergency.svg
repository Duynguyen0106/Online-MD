<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-label="Ectopic pregnancy emergency">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f6f5e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f7faf8"/>
  <rect x="1" y="1" width="638" height="248" fill="none" stroke="#c5d4cb" stroke-width="1"/>
  
      <text x="24" y="28" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1a3a2f">Ectopic — stability decides the lane</text>
      <rect x="40" y="70" width="160" height="50" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="120" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">+ hCG</text>
<text x="120" y="102" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">± pain/bleed</text>
      <line x1="200" y1="95" x2="250" y2="95" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <rect x="250" y="70" width="160" height="50" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="330" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Unstable?</text>
      <line x1="300" y1="120" x2="200" y2="160" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <line x1="330" y1="120" x2="450" y2="160" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <rect x="100" y="165" width="180" height="50" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="190" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">OR / resus</text>
      <rect x="400" y="165" width="200" height="50" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="500" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">US + MTX vs surgery</text>
      <text x="40" y="240" font-family="Georgia, serif" font-size="11" fill="#5c7268">Do not send unstable patients on a “serial hCG stroll”</text>
    
</svg>