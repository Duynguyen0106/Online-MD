<text x="525" y="117" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">choice</text>
      <text x="30" y="175" font-family="Georgia, serif" font-size="12" fill="#5c7268">If incapacitated: substituted judgment → best interest · Document the source of authority</text>
    
