<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="Pediatric asthma exacerbation">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f6f5e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f7faf8"/>
  <rect x="1" y="1" width="638" height="238" fill="none" stroke="#c5d4cb" stroke-width="1"/>
  
      <text x="24" y="28" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1a3a2f">Asthma exacerbation — escalate by response</text>
      <rect x="30" y="85" width="140" height="55" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="100" y="105.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">O₂ + SABA</text>
<text x="100" y="119.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">± ipratropium</text>
      <line x1="170" y1="112" x2="210" y2="112" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <rect x="210" y="85" width="140" height="55" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="280" y="105.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Systemic</text>
<text x="280" y="119.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">steroids</text>
      <line x1="350" y1="112" x2="390" y2="112" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <rect x="390" y="85" width="210" height="55" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="495" y="105.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Mg / airway</text>
<text x="495" y="119.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">team if failing</text>
      <text x="30" y="185" font-family="Georgia, serif" font-size="12" fill="#5c7268">Silent chest is late · Reassess after each step</text>
    
</svg>