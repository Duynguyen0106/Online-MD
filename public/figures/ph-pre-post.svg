<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270" role="img" aria-label="Pre versus post capillary pulmonary hypertension map">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f6f5e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f7faf8"/>
  <rect x="1" y="1" width="638" height="268" fill="none" stroke="#c5d4cb" stroke-width="1"/>
  
      <text x="24" y="28" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1a3a2f">PH — pre- vs post-capillary framing</text>
      <rect x="40" y="75" width="250" height="90" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="165" y="106" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Pre-capillary pattern</text>
<text x="165" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Pulmonary arterial side</text>
<text x="165" y="134" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">↑ PVR thinking</text>
      <rect x="350" y="75" width="250" height="90" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="475" y="106" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Post-capillary pattern</text>
<text x="475" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Left-heart / venous side</text>
<text x="475" y="134" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">↑ Filling-pressure thinking</text>
      <text x="40" y="200" font-family="Georgia, serif" font-size="12" fill="#5c7268">Groups 1–5 are classification language — do not invent mPAP/PCWP cutoffs here</text>
      <text x="40" y="225" font-family="Georgia, serif" font-size="12" fill="#b86b3c">Faculty: attach current ESC/ERS definitions before numeric teaching</text>
    
</svg>