<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-label="Pentose phosphate pathway schematic">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f6f5e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f7faf8"/>
  <rect x="1" y="1" width="638" height="248" fill="none" stroke="#c5d4cb" stroke-width="1"/>
  
      <text x="24" y="28" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1a3a2f">PPP — oxidative vs non-oxidative</text>
      <rect x="40" y="80" width="140" height="55" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="110" y="107.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">G6P</text>
      <line x1="180" y1="107" x2="220" y2="107" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <rect x="220" y="70" width="160" height="70" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="300" y="91" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Oxidative</text>
<text x="300" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">NADPH +</text>
<text x="300" y="119" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">CO₂</text>
      <line x1="380" y1="107" x2="420" y2="107" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <rect x="420" y="70" width="180" height="70" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="510" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Non-oxidative</text>
<text x="510" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">R5P ↔ F6P/GAP</text>
      <text x="40" y="185" font-family="Georgia, serif" font-size="12" fill="#5c7268">G6PD: can't make NADPH → hemolysis under oxidant stress</text>
    
</svg>