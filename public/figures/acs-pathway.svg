<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-label="ACS clinical pathway">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f6f5e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f7faf8"/>
  <rect x="1" y="1" width="638" height="248" fill="none" stroke="#c5d4cb" stroke-width="1"/>
  
      <text x="24" y="28" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1a3a2f">ACS — ECG then pathway</text>
      <rect x="40" y="75" width="140" height="50" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="110" y="93" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">ABCs +</text>
<text x="110" y="107" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">ECG</text>
      <line x1="180" y1="100" x2="230" y2="100" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <rect x="230" y="60" width="160" height="40" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="310" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">STEMI</text>
      <rect x="230" y="115" width="160" height="40" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="310" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">UA/NSTEMI</text>
      <line x1="390" y1="80" x2="440" y2="80" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <line x1="390" y1="135" x2="440" y2="135" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <rect x="440" y="55" width="160" height="50" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="520" y="73" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Reperfusion</text>
<text x="520" y="87" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">clock</text>
      <rect x="440" y="120" width="160" height="50" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="520" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Risk ± early</text>
<text x="520" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">invasive</text>
      <text x="40" y="210" font-family="Georgia, serif" font-size="12" fill="#5c7268">Aspirin early unless contraindicated · Don't delay reperfusion for troponin</text>
    
</svg>