<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-label="Serotonin syndrome versus NMS">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f6f5e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f7faf8"/>
  <rect x="1" y="1" width="638" height="258" fill="none" stroke="#c5d4cb" stroke-width="1"/>
  
      <text x="24" y="28" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1a3a2f">SS vs NMS — don't mix the maps</text>
      <rect x="40" y="80" width="260" height="90" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="170" y="104" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Serotonin syndrome</text>
<text x="170" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Clonus / hyperreflexia</text>
<text x="170" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Serotonergic drugs</text>
<text x="170" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Cool + stop + cypro/benzo</text>
      <rect x="340" y="80" width="260" height="90" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="470" y="104" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">NMS</text>
<text x="470" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Lead-pipe rigidity</text>
<text x="470" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Antipsychotic context</text>
<text x="470" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Stop + support ± dantrolene/bromo</text>
      <text x="40" y="210" font-family="Georgia, serif" font-size="12" fill="#5c7268">Onset speed + reflex exam often separates them before labs return</text>
    
</svg>