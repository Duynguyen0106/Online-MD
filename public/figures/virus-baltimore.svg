<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="DNA versus RNA virus comparison">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f6f5e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f7faf8"/>
  <rect x="1" y="1" width="638" height="238" fill="none" stroke="#c5d4cb" stroke-width="1"/>
  
      <text x="24" y="28" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1a3a2f">Virus genome → clinical intuition</text>
      <rect x="40" y="85" width="250" height="65" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="165" y="103.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">DNA viruses</text>
<text x="165" y="117.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Nucleus (often)</text>
<text x="165" y="131.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">More stable genomes</text>
      <rect x="350" y="85" width="250" height="65" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="475" y="103.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">RNA viruses</text>
<text x="475" y="117.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Cytoplasm (often)</text>
<text x="475" y="131.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Higher mutation rate</text>
      <text x="40" y="190" font-family="Georgia, serif" font-size="12" fill="#5c7268">Exception lists matter — learn the rule, then the famous exceptions</text>
    
</svg>