<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Glomerular Starling forces and GFR schematic">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f6f5e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f7faf8"/>
  <rect x="1" y="1" width="638" height="278" fill="none" stroke="#c5d4cb" stroke-width="1"/>
  
      <text x="24" y="28" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1a3a2f">GFR — Starling forces in the glomerulus</text>
      <rect x="40" y="70" width="150" height="55" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="115" y="90.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">P_gc</text>
<text x="115" y="104.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Hydrostatic ↑</text>
      <rect x="220" y="70" width="150" height="55" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="295" y="90.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">π_gc</text>
<text x="295" y="104.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Oncotic ↓</text>
      <rect x="400" y="70" width="180" height="55" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="490" y="90.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Net filtration</text>
<text x="490" y="104.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">× Kf → GFR</text>
      <line x1="190" y1="97" x2="220" y2="97" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <line x1="370" y1="97" x2="400" y2="97" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <rect x="40" y="160" width="170" height="55" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="125" y="180.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Afferent</text>
<text x="125" y="194.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">constrict → ↓GFR</text>
      <rect x="240" y="160" width="200" height="55" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="340" y="180.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Moderate efferent</text>
<text x="340" y="194.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">constrict → ↑P_gc / FF</text>
      <rect x="470" y="160" width="130" height="55" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="535" y="180.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">FF =</text>
<text x="535" y="194.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">GFR / RPF</text>
      <text x="40" y="250" font-family="Georgia, serif" font-size="12" fill="#5c7268">P_bs and π_bs usually small; teach tone → pressure → filtration before memorizing drug arrows</text>
      <text x="40" y="270" font-family="Georgia, serif" font-size="11" fill="#b86b3c">Educational schematic — not a patient-specific pressure trace</text>
    
</svg>