<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="TB latency versus active disease">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f6f5e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f7faf8"/>
  <rect x="1" y="1" width="638" height="238" fill="none" stroke="#c5d4cb" stroke-width="1"/>
  
      <text x="24" y="28" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1a3a2f">TB — stage decides the ask</text>
      <rect x="30" y="90" width="140" height="50" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="100" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Exposure</text>
      <line x1="170" y1="115" x2="200" y2="115" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <rect x="200" y="90" width="160" height="50" rx="6" fill="#e3eee8" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="280" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Latent TB</text>
<text x="280" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Containment</text>
      <line x1="360" y1="115" x2="390" y2="115" stroke="#2f6f5e" stroke-width="2" marker-end="url(#ah)"/>
  
      <rect x="390" y="90" width="210" height="50" rx="6" fill="#f3e8df" stroke="#2f6f5e" stroke-width="1.5"/>
  <text x="495" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Active disease</text>
<text x="495" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a3a2f">Symptoms ± contagion</text>
      <text x="30" y="185" font-family="Georgia, serif" font-size="12" fill="#5c7268">IGRA/TST ≠ active disease · Treat latent to prevent reactivation</text>
    
</svg>